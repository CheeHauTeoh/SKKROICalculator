name: Verify live pricing app

# Runs the end-to-end live checks against the URL in .github/netlify-verify-request.txt whenever that
# file changes, or on demand.
on:
  push:
    paths: [".github/netlify-verify-request.txt"]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed base URL"
        required: false
        default: "https://sk-keong-pricing.netlify.app"
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live checks
        run: |
          URL="${{ inputs.base_url }}"
          if [ -z "$URL" ] && [ -s .github/netlify-verify-request.txt ]; then URL=$(grep -v "^#" .github/netlify-verify-request.txt | head -1 | tr -d "[:space:]"); fi
          if [ -z "$URL" ]; then echo "no URL requested"; exit 0; fi
          # optional second non-comment line: an owner password to test (one-off, cleared after the run)
          export OWNER_TEST_PASSWORD=$(grep -v "^#" .github/netlify-verify-request.txt 2>/dev/null | sed -n 2p | tr -d "[:space:]")
          node pricing-app/scripts/verify-live.mjs "$URL"
